upstream chi-phi-doan-fe-upstream {
    server chi-phi-doan-fe:80;
}

server {
    listen 80;
    # Đặt domain dev thật của Techzen trước buổi workshop
    server_name chi-phi-doan-dev.techzen.internal;

    location / {
        proxy_pass http://chi-phi-doan-fe-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
